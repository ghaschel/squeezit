name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: squeezit-release-mutation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.16.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Validate immutable release inputs
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          test "$VERSION" = "$PACKAGE_VERSION"
          test -f "changelogs/$VERSION.md"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          set +e
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" 2>"$RUNNER_TEMP/release-lookup-error")"
          release_status=$?
          set -e
          if [ "$release_status" -eq 0 ]; then
            IS_DRAFT="$(jq -r '.draft' <<<"$release_json")"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Release $GITHUB_REF_NAME is already published; refusing to overwrite it." >&2
              exit 1
            fi
          elif ! grep -q "HTTP 404" "$RUNNER_TEMP/release-lookup-error"; then
            cat "$RUNNER_TEMP/release-lookup-error" >&2
            echo "Unable to prove that $GITHUB_REF_NAME has no published release." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: bun ci

      - name: Typecheck
        run: bun run typecheck

      - name: Install CLI test image tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes pngcrush optipng
          cargo install oxipng --version 10.1.0 --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Test CLI surface
        run: bun run test:cli

      - name: Check package exports
        run: bun run check:exports

      - name: Inspect npm package
        run: HUSKY=0 npm pack --dry-run

  publish_npm:
    name: Publish npm package
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.16.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Install locked dependencies
        run: bun ci

      - name: Publish or resume exact npm version
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH_DIR="$RUNNER_TEMP/npm-publish"
          mkdir -p "$PUBLISH_DIR"
          bun run build
          HUSKY=0 npm pack --ignore-scripts --pack-destination "$PUBLISH_DIR"
          shopt -s nullglob
          tarballs=("$PUBLISH_DIR"/*.tgz)
          test "${#tarballs[@]}" -eq 1
          NPM_TARBALL="${tarballs[0]}"
          test -f "$NPM_TARBALL"
          LOCAL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$NPM_TARBALL" | base64 | tr -d '\n')"

          set +e
          view_output="$(npm view "squeezit@$VERSION" dist.integrity 2>&1)"
          view_status=$?
          set -e

          if [ "$view_status" -eq 0 ]; then
            PUBLISHED_INTEGRITY="$view_output"
            if [ -n "$PUBLISHED_INTEGRITY" ] && \
              test "$PUBLISHED_INTEGRITY" = "$LOCAL_INTEGRITY"; then
              echo "squeezit@$VERSION already exists with the verified tarball; skipping npm publish."
              exit 0
            fi
            echo "Registry integrity does not match the tarball built from $GITHUB_SHA." >&2
            exit 1
          fi

          if ! grep -q "E404" <<<"$view_output"; then
            echo "$view_output" >&2
            echo "Unable to prove that squeezit@$VERSION is unpublished." >&2
            exit 1
          fi

          HUSKY=0 npm publish "$NPM_TARBALL" --access public --provenance

  package_archives:
    name: Package and verify release archives
    needs: [validate, publish_npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      npm_tarball_sha256: ${{ steps.artifacts.outputs.npm_tarball_sha256 }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.16.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Build archives in temporary Oclif staging
        id: artifacts
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e package-lock.json

          STAGE="$RUNNER_TEMP/oclif-package"
          ARTIFACT_DIR="$RUNNER_TEMP/release-artifacts"
          mkdir -p "$STAGE" "$ARTIFACT_DIR"
          git archive --format=tar HEAD | tar -xf - -C "$STAGE"

          pushd "$STAGE"
          bun ci
          npm install --package-lock-only --ignore-scripts
          test -f package-lock.json
          bun run build
          TARGETS="$(node -e 'process.stdout.write(require("./package.json").oclif.update.node.targets.join(","))')"
          bunx oclif pack tarballs --no-xz --prune-lockfiles --root "$STAGE" --targets "$TARGETS" --sha "${GITHUB_SHA::7}"
          popd

          IFS=',' read -ra targets <<<"$TARGETS"
          for target in "${targets[@]}"; do
            mapfile -t matches < <(find "$STAGE/dist" -type f -name "*-${target}.tar.gz" -print)
            test "${#matches[@]}" -eq 1
            normalized="squeezit-v${VERSION}-${target}.tar.gz"
            cp "${matches[0]}" "$ARTIFACT_DIR/$normalized"
          done

          NPM_TARBALL_URL=""
          for attempt in $(seq 1 30); do
            if NPM_TARBALL_URL="$(npm view "squeezit@$VERSION" dist.tarball 2>/dev/null)" && [ -n "$NPM_TARBALL_URL" ]; then
              if curl --fail --silent --show-error --location "$NPM_TARBALL_URL" --output "$RUNNER_TEMP/squeezit-$VERSION.tgz"; then
                break
              fi
            fi
            NPM_TARBALL_URL=""
            echo "Waiting for squeezit@$VERSION to become available on npm ($attempt/30)..."
            sleep 10
          done
          test -n "$NPM_TARBALL_URL"

          NPM_TARBALL_SHA256="$(sha256sum "$RUNNER_TEMP/squeezit-$VERSION.tgz" | awk '{print $1}')"
          echo "npm_tarball_sha256=$NPM_TARBALL_SHA256" >> "$GITHUB_OUTPUT"

          pushd "$ARTIFACT_DIR"
          sha256sum squeezit-v"$VERSION"-*.tar.gz > SHA256SUMS
          node - "$VERSION" "$NPM_TARBALL_URL" "$NPM_TARBALL_SHA256" <<'NODE'
          const fs = require("node:fs");

          const [version, npmUrl, npmSha256] = process.argv.slice(2);
          const archives = Object.fromEntries(
            fs.readFileSync("SHA256SUMS", "utf8")
              .trim()
              .split("\n")
              .map((line) => {
                const [sha256, archive] = line.trim().split(/\s+/, 2);
                return [archive, { sha256 }];
              })
          );
          const metadata = {
            version,
            npmTarball: { url: npmUrl, sha256: npmSha256 },
            archives,
          };
          fs.writeFileSync("release-metadata.json", `${JSON.stringify(metadata, null, 2)}\n`);
          NODE

          sha256sum --check SHA256SUMS
          for archive in squeezit-v"$VERSION"-*.tar.gz; do
            if tar -tzf "$archive" | grep -Eq '(^|/)(package-lock\.json|npm-shrinkwrap\.json|yarn\.lock)$'; then
              echo "Archive contains a forbidden npm-family lockfile: $archive" >&2
              exit 1
            fi
          done
          for archive in squeezit-v"$VERSION"-darwin-*.tar.gz; do
            tar -tzf "$archive" | grep -q '/bin/sqz$'
          done

          SMOKE_DIR="$RUNNER_TEMP/linux-smoke"
          mkdir -p "$SMOKE_DIR"
          tar -xzf "squeezit-v${VERSION}-linux-x64.tar.gz" -C "$SMOKE_DIR"
          SQZ="$(find "$SMOKE_DIR" -type f -path '*/bin/sqz' -print -quit)"
          test -n "$SQZ"
          export PATH="$(dirname "$SQZ"):$PATH"
          sqz version --json
          sqz commands --json
          sqz compress --help
          popd

          test ! -e package-lock.json

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: |-
            ${{ runner.temp }}/release-artifacts/squeezit-v${{ needs.validate.outputs.version }}-darwin-arm64.tar.gz
            ${{ runner.temp }}/release-artifacts/squeezit-v${{ needs.validate.outputs.version }}-darwin-x64.tar.gz
            ${{ runner.temp }}/release-artifacts/squeezit-v${{ needs.validate.outputs.version }}-linux-x64.tar.gz
            ${{ runner.temp }}/release-artifacts/SHA256SUMS
            ${{ runner.temp }}/release-artifacts/release-metadata.json
          if-no-files-found: error
          retention-days: 7

  draft_release:
    name: Create or resume draft release
    needs: [validate, publish_npm, package_archives]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: artifacts

      - name: Create draft and replace its artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if release_json="$(gh release view "$TAG" --json isDraft 2>/dev/null)"; then
            IS_DRAFT="$(jq -r '.isDraft' <<<"$release_json")"
            test "$IS_DRAFT" = "true"
          else
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "squeezit $TAG" \
              --notes-file "changelogs/$VERSION.md"
          fi
          gh release edit "$TAG" --notes-file "changelogs/$VERSION.md"
          gh release upload "$TAG" artifacts/* --clobber

  update_tap:
    name: Test and update Homebrew tap
    needs: [validate, publish_npm, package_archives, draft_release]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: source

      - name: Checkout personal Homebrew tap default branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ghaschel/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Render formula and prepare local tap commit
        id: formula
        env:
          NPM_TARBALL_SHA256: ${{ needs.package_archives.outputs.npm_tarball_sha256 }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tap/Formula/squeezit.rb ]; then
            EXISTING_VERSION="$(ruby -ne 'match = $_.match(%r{/squeezit-([^/"]+)\.tgz}); puts match[1] if match; exit if match' tap/Formula/squeezit.rb)"
            if [ -n "$EXISTING_VERSION" ] && ! ruby -e 'require "rubygems"; existing = Gem::Version.new(ARGV[0]); requested = Gem::Version.new(ARGV[1]); exit(requested >= existing ? 0 : 1)' "$EXISTING_VERSION" "$VERSION"; then
              echo "Refusing to replace newer tap formula $EXISTING_VERSION with $VERSION." >&2
              exit 1
            fi
          fi

          bun source/scripts/render-homebrew-formula.ts \
            --version "$VERSION" \
            --sha256 "$NPM_TARBALL_SHA256" \
            --output tap/Formula/squeezit.rb

          if git -C tap diff --quiet -- Formula/squeezit.rb && \
            [ -z "$(git -C tap ls-files --others --exclude-standard -- Formula/squeezit.rb)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git -C tap config user.name "github-actions[bot]"
            git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C tap add Formula/squeezit.rb
            git -C tap commit -m "squeezit $VERSION"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install from local tap and smoke-test formula
        env:
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        shell: bash
        run: |
          set -euo pipefail
          brew tap ghaschel/tap "$GITHUB_WORKSPACE/tap"
          brew install --build-from-source ghaschel/tap/squeezit
          sqz version --json
          sqz doctor --json

      - name: Push tested tap update
        if: steps.formula.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAP_BRANCH="$(git -C tap branch --show-current)"
          test -n "$TAP_BRANCH"
          git -C tap push origin HEAD:"$TAP_BRANCH"

  publish_release:
    name: Publish GitHub release
    needs: update_tap
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
